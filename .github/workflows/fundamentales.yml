name: Actualizar fundamentales

on:
  schedule:
    # Una vez por semana: domingo 14:00 UTC
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fundamentales:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar librerías
        run: pip install yfinance pandas
      - name: Bajar las cifras base de cada empresa
        run: python actualizar_fundamentales.py
      - name: Subir los cambios al repositorio
        run: |
          git config user.name "historial-bot"
          git config user.email "historial-bot@users.noreply.github.com"
          git add fundamentales.csv
          git diff --cached --quiet || git commit -m "Fundamentales $(date -u +%F)"
          git pull --rebase
          git push
